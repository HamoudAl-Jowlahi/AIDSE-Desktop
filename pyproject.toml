[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aidse-api"
version = "0.1.0"
description = "AIDSE Platform — FastAPI Backend"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
packages = ["apps"]

# =============================================================================
# Production dependencies (pinned for reproducibility — Section 23.4)
# =============================================================================

[tool.pip-tools]
generate-hashes = true

# Core dependencies (managed via requirements files for now, pyproject for tooling)

# =============================================================================
# Ruff linting (Section 23.4)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # bandit security
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of assert (allowed in tests)
]
exclude = [
    ".venv",
    "migrations",
    "__pycache__",
]

[tool.ruff.per-file-ignores]
"*/tests/*" = ["ANN", "S"]  # Relax annotation/security rules in tests

# =============================================================================
# Black formatting (Section 23.4)
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
  | migrations
  | __pycache__
)/
'''

# =============================================================================
# Pytest (Section 23.5)
# =============================================================================
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/modules", "apps/api/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["apps/api"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
