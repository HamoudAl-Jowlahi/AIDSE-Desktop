# Alembic migration environment configuration
# Section 10 (Database Design), Section 23.2 Rule 6 (migrations via Alembic only)

[alembic]
# Path to migration scripts
script_location = apps/api/db/migrations

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate the "slug" field in %%(slug)s to this number of characters
truncate_slug_length = 40

# Version path separator
version_path_separator = os

# sqlalchemy.url is overridden in env.py to use the DATABASE_URL env var
sqlalchemy.url = postgresql+asyncpg://aidse:aidse_dev_password@localhost:5432/aidse

[post_write_hooks]
# Apply ruff and black to new migration files (Section 23.4)
hooks = ruff, black
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = --fix REVISION_SCRIPT_FILENAME
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
