[package]
name = "aidse-desktop"
version = "0.1.0"
description = "AIDSE Desktop — AI Data Scientist & Evaluation Platform"
authors = ["AIDSE Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
# Cryptographically strong token shared only between this shell and the
# sidecar it spawns.
rand = "0.8"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
