services:
  # ─────────────────────────────────────────────
  # PostgreSQL 16
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aidse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aidse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aidse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aidse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aidse}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aidse_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─────────────────────────────────────────────
  # MinIO (S3-compatible object storage for local dev)
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: aidse_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-aidse_minio_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aidse_minio_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────
  # FastAPI Application
  # ─────────────────────────────────────────────
  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: aidse_api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidse}:${POSTGRES_PASSWORD:-aidse_dev_password}@db:5432/${POSTGRES_DB:-aidse}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../../apps/api:/app/apps/api       # Hot reload
      - ../../packages:/app/packages
      - ../../keys:/app/keys
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn apps.api.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/apps/api

  # ─────────────────────────────────────────────
  # Celery Worker
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    container_name: aidse_worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aidse}:${POSTGRES_PASSWORD:-aidse_dev_password}@db:5432/${POSTGRES_DB:-aidse}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: minio:9000
    volumes:
      - ../../services/worker:/app/services/worker   # Hot reload
      - ../../packages:/app/packages
      - ../../keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A services.worker.celery_app worker
        --loglevel=info
        --concurrency=4
        --queues=default,evaluation,profiling,training

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
