name: AIDSE CI Pipeline
# Section 23.7 (Git Workflow), Section 18.2 (Phase 0 Acceptance Criteria)
# CI must pass on every push before merge to main.

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─────────────────────────────────────────────
  # Backend: Lint + Test
  # ─────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install linting tools
        run: pip install ruff black

      - name: ruff check (Section 23.4)
        run: ruff check apps/ services/ packages/

      - name: black check (Section 23.4)
        run: black --check apps/ services/ packages/

  backend-test:
    name: Backend — Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate test JWT keys
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Run tests with coverage (Section 23.5)
        run: |
          pytest apps/api/modules apps/api/tests \
            --cov=apps/api/modules \
            --cov-report=term-missing \
            --cov-report=xml \
            -v
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          JWT_PRIVATE_KEY_PATH: "./keys/private.pem"
          JWT_PUBLIC_KEY_PATH: "./keys/public.pem"
          APP_ENV: "test"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # Frontend: Type Check + Lint + Build
  # ─────────────────────────────────────────────
  frontend-check:
    name: Frontend — TypeScript + ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check (Section 23.4)
        run: npx tsc --noEmit

      - name: ESLint check (Section 23.4)
        run: npx eslint . --max-warnings 0

      - name: Next.js build check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"

  # ─────────────────────────────────────────────
  # Docker: Build check
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker — Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build \
            -f infrastructure/docker/api.Dockerfile \
            -t aidse-api:ci-test \
            .

      - name: Build Worker image
        run: |
          docker build \
            -f infrastructure/docker/worker.Dockerfile \
            -t aidse-worker:ci-test \
            .
